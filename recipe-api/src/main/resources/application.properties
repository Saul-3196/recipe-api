spring.application.name=recipe-api

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gourmetkitchendb}
spring.datasource.username=${DB_USER:gourmetuser}
spring.datasource.password=${DB_PASSWORD:gourmetpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
springdoc.model-and-view-allowed=true
springdoc.show-actuator=false

