version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: gourmetkitchen-postgres
    environment:
      POSTGRES_DB: gourmetkitchendb
      POSTGRES_USER: gourmetuser
      POSTGRES_PASSWORD: gourmetpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: